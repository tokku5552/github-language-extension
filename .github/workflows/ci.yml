name: ci
on:
  pull_request:
    branches:
      - main
      - develop
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
  lint:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
      - name: yarn lint
        run: yarn lint
  typecheck:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
      - name: yarn typecheck
        run: yarn typecheck
  test:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
      - name: yarn test
        run: yarn test
  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
      - name: build
        run: yarn build
      - name: Smoke test the build output
        run: yarn test:dist
      - name: Update manifest.json
        run: |
          npx dot-json@1 dist/manifest.json version dummy
      - name: Archive
        run: |
          zip -r extension.zip ./dist
      - name: Check Archive
        run: |
          rm -rf ./dist
          unzip extension.zip
          ls -lR ./dist
  # Single required status check for branch protection.
  # Skipped jobs count as passing, so a failed `prepare` must fail this job explicitly.
  ci-result:
    runs-on: ubuntu-latest
    if: always()
    needs: [prepare, lint, typecheck, test, build]
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
