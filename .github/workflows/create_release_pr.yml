name: create_release_pr
on:
  schedule:
    - cron: 0 6 * * 1

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Set current datetime as env variable
        env:
          TZ: 'Asia/Tokyo'
        run: echo "CURRENT_DATETIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Create Branch
        run: git checkout -b release/gha_${{ env.CURRENT_DATETIME }}

      - name: Push Branch
        run: git push origin release/gha_${{ env.CURRENT_DATETIME }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          BRANCH_NAME: release/gha_${{ env.CURRENT_DATETIME }}
        run: |
          gh pr create --title "[bot(create_release_pr)]: created at ${{ env.CURRENT_DATETIME }}" --body "[bot(create_release_pr)]: created at ${{ env.CURRENT_DATETIME }}" --base main --head $BRANCH_NAME
