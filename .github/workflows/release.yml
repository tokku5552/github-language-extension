name: release
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and archive only (skip the Chrome Web Store upload and the GitHub release)'
        type: boolean
        default: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual runs always release main, whichever branch is picked in the UI
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: cache-node-modules-${{ hashFiles('yarn.lock') }}
      - name: yarn install
        run: |
          yarn install --ignore-scripts
      - uses: fregante/daily-version-action@v3
        id: daily-version
      - name: build
        run: yarn build
      - name: Update manifest.json
        run: |
          npx dot-json@1 dist/manifest.json version ${{ steps.daily-version.outputs.version }}
      - name: Archive
        run: |
          zip -r extension.zip ./dist
      - name: Check Archive
        run: |
          rm -rf ./dist
          unzip extension.zip
          ls -lR ./dist
      - name: Upload artifact (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ steps.daily-version.outputs.version }}
          path: extension.zip
      - name: Submit
        if: github.event.inputs.dry_run != 'true'
        run: |
          npx chrome-webstore-upload-cli@2 upload --source extension.zip --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      - name: Create release draft
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.daily-version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: extension.zip
